<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allison Brown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;1,9..144,200&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #1B2A3B;
      color: #fff;
      position: relative;
    }

    /* Photo: right half, full bleed */
    .photo {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 44%;
      overflow: hidden;
      clip-path: inset(0 100% 0 0);
      animation: photoReveal 1.1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes photoReveal {
      to { clip-path: inset(0 0% 0 0); }
    }

    .photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 8%;
      display: block;
    }

    .photo::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 160px;
      background: linear-gradient(to right, #1B2A3B, transparent);
      pointer-events: none;
    }

    /* Under construction — top right corner, clean */
    .tag {
      position: fixed;
      top: 2rem;
      left: 5vw;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(200,216,234,0.5);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.5s 1s ease forwards;
    }

    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(200,216,234,0.5);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* Name — bottom left, big */
    .content {
      position: fixed;
      left: 0; bottom: 0;
      width: 60%;
      padding: 0 4vw 5vh 5vw;
      z-index: 5;
    }

    .headline-line { overflow: hidden; display: block; }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 200;
      font-size: clamp(5rem, 12vw, 12.5rem);
      line-height: 0.88;
      letter-spacing: -0.025em;
      color: #fff;
      display: block;
      transform: translateY(110%);
      animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }

    h1.l2 {
      font-style: italic;
      color: #748CAB;
      animation-delay: 0.25s;
    }

    @keyframes slideUp { to { transform: translateY(0); } }

    /* Links — connected strip */
    .links {
      display: flex;
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.6s 0.65s ease forwards;
      width: fit-content;
    }

    .links a {
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #C8D8EA;
      text-decoration: none;
      padding: 0.65rem 1.4rem;
      border: 1px solid rgba(200,216,234,0.2);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .links a + a { border-left: none; }

    .links a:hover {
      color: #fff;
      background: rgba(74,111,165,0.25);
      border-color: rgba(200,216,234,0.45);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (max-width: 640px) {
      html, body { overflow: auto; }

      .photo {
        position: relative;
        width: 100%; height: 60vw;
        clip-path: none; animation: none;
      }
      .photo::after { display: none; }

      .tag { top: 1.2rem; right: 1.2rem; }

      .content {
        position: relative;
        width: 100%;
        padding: 2.5rem 6vw 4rem;
      }

      h1 { font-size: clamp(3.5rem, 15vw, 7rem); }
      .links { flex-wrap: wrap; }
    }
  </style>
</head>
